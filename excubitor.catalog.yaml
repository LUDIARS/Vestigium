services:
  - code: victorialogs
    name: VictoriaLogs
    tier: infra
    project_code: vestigium
    component: backend
    port: 9428
    repo: LUDIARS/Vestigium
    # Excubitor executes the command directly for this runtime.
    runtime: node
    cwd: ${ARS_ROOT}/Vestigium
    command: '".local/victorialogs/victoria-logs-windows-amd64-prod.exe" -httpListenAddr=127.0.0.1:9428 -storageDataPath=.local/victorialogs/data -retentionPeriod=7d -envflag.enable=false'
    autostart: false
    restart_policy: "no"
    health:
      type: http
      url: http://127.0.0.1:9428/health
    provides:
      VESTIGIUM_VICTORIALOGS_URL: http://127.0.0.1:${port}

  - code: vestigium-sink
    name: Vestigium VictoriaLogs sink
    tier: infra
    project_code: vestigium
    component: worker
    repo: LUDIARS/Vestigium
    runtime: node
    cwd: ${ARS_ROOT}/Vestigium
    build_command: 'cmake -S cpp -B .local/sink-build -G "Visual Studio 18 2026" -A x64 -DBUILD_TESTING=OFF -DPORTUS_SOURCE_DIR="${ARS_ROOT}/Portus/cpp" -DCMAKE_PREFIX_PATH="${ARS_ROOT}/.toolchains/lorica-7972dea;C:/Program Files/OpenSSL-Win64" && cmake --build .local/sink-build --config Release --target vestigium-sink'
    command: '".local/sink-build/Release/vestigium-sink.exe" --watch --logs-dir "${ARS_ROOT}/logs"'
    depends_on: [victorialogs]
    required_env: [VESTIGIUM_VICTORIALOGS_URL]
    autostart: false
    restart_policy: on-failure
    health:
      type: process
